# P3.3a (R5): So sánh các chính sách rollout L0–L4 cùng thời gian suy nghĩ (time_s = 0.08 s/nước) trên bàn Caro 9×9.
# Chạy: python -m experiments.run configs/p33a_r5_equal_time.yaml --workers 4
name: p33a_r5_equal_time
seed: 2026
games: 200
swap_first: true
opening_plies: 2
game:
  type: gomoku
  size: 9
matchups:
  # 1. So sánh L0–L4 cùng ngân sách thời gian 0.08 s/nước trước cùng đối thủ chuẩn MCTS-L0 (0.08 s/nước)
  - a:
      type: mcts
      rollout: [l0, l1, l2, l3, l4]
      selection: robust
      use_candidates: true
      candidate_radius: 2
      reuse_tree: false
      c: 1.4
      budget:
        time_s: 0.08
    b:
      type: mcts
      rollout: l0
      selection: robust
      use_candidates: true
      candidate_radius: 2
      reuse_tree: false
      c: 1.4
      budget:
        time_s: 0.08
